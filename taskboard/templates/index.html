<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBoard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main id="project-page" class="project-page">
    <header class="page-header">
      <div>
        <p class="eyebrow">Polecat</p>
        <h1>TaskBoard</h1>
        <p class="page-description">Plan and track the work that matters.</p>
      </div>
      <button id="new-project" class="button button-primary" type="button">New project</button>
    </header>

    <section id="project-form-region" class="state-region" aria-labelledby="project-form-title" hidden>
      <h2 id="project-form-title">Project details</h2>
      <form id="project-form" class="project-form">
        <div class="form-grid">
          <label for="name">Name
            <input id="name" name="name" type="text" required>
          </label>
            <input id="title" name="title" type="text" required>
          </label>
            <input id="description" name="description" type="text">
          </label>
            <input id="status" name="status" type="text">
          </label>
            <input id="priority" name="priority" type="number" min="0">
          </label>
          </label>
          </label>
        </div>
        <div class="form-actions">
          <button id="cancel-project" class="button button-secondary" type="button">Cancel</button>
          <button class="button button-primary" type="submit">Save project</button>
        </div>
      </form>
    </section>

    <section class="project-controls" aria-label="Project filters">
      <label for="project-filter">Filter projects
        <input id="project-filter" name="project-filter" type="search" placeholder="Search projects">
      </label>
      <label for="status-filter">Status
        <select id="status-filter" name="status-filter">
          <option value="">All statuses</option>
          <option value="todo">To do</option>
          <option value="in_progress">In progress</option>
          <option value="done">Done</option>
        </select>
      </label>
    </section>

    <section id="project-state" class="state-region" aria-live="polite">
      <p id="loading-state" class="state-message" hidden>Loading projects…</p>
      <p id="empty-state" class="state-message" hidden>No projects yet.</p>
      <p id="error-state" class="state-message state-error" hidden></p>
    </section>

    <section id="project-columns" class="project-columns" aria-label="Projects">
      <div id="project-list" class="project-list"></div>
    </section>
    <section id="taskboard-region" aria-labelledby="taskboard-heading" hidden>
      <div class="taskboard-header">
        <div>
          <p class="eyebrow">Selected project</p>
          <h2 id="taskboard-heading">TaskBoard</h2>
        </div>
        <button id="back-to-projects" type="button">Back to projects</button>
      </div>
      <form id="task-form" hidden>
        <label for="task-title">Task title</label>
        <input id="task-title" name="title" type="text" required maxlength="200">
        <label for="task-description">Description</label>
        <textarea id="task-description" name="description" rows="3"></textarea>
        <button type="submit">Save task</button>
        <button id="cancel-task" type="button">Cancel</button>
      </form>
      <button id="new-task" type="button">New task</button>
      <p id="task-loading-state" hidden>Loading tasks…</p>
      <p id="task-empty-state" hidden>No tasks yet.</p>
      <div id="task-error-state" role="alert" hidden></div>
      <div id="kanban-board" class="kanban-board">
        <section id="todo-column" class="kanban-column" aria-labelledby="todo-heading">
          <h3 id="todo-heading">To Do</h3>
          <div id="todo-tasks" class="task-list"></div>
        </section>
        <section id="doing-column" class="kanban-column" aria-labelledby="doing-heading">
          <h3 id="doing-heading">Doing</h3>
          <div id="doing-tasks" class="task-list"></div>
        </section>
        <section id="done-column" class="kanban-column" aria-labelledby="done-heading">
          <h3 id="done-heading">Done</h3>
          <div id="done-tasks" class="task-list"></div>
        </section>
      </div>
    </section>
      <section id="taskboard-region" hidden aria-labelledby="taskboard-title">
      <div class="section-heading">
        <h2 id="taskboard-title">Tasks</h2>
        <label for="task-project-filter">Filter tasks
          <select id="task-project-filter">
            <option value="">All projects</option>
          </select>
        </label>
      </div>
      <form id="task-form">
        <label for="task-title">Title <span aria-hidden="true">*</span></label>
        <input id="task-title" name="title" required>
        <label for="task-description">Description</label>
        <textarea id="task-description" name="description"></textarea>
        <label for="task-priority">Priority</label>
        <select id="task-priority" name="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button type="submit">Add task</button>
      </form>
      <div id="kanban-board" class="kanban-board">
        <section id="todo-column" class="kanban-column" aria-labelledby="todo-heading">
          <h3 id="todo-heading">To do</h3>
          <div class="task-list"></div>
        </section>
        <section id="doing-column" class="kanban-column" aria-labelledby="doing-heading">
          <h3 id="doing-heading">Doing</h3>
          <div class="task-list"></div>
        </section>
        <section id="done-column" class="kanban-column" aria-labelledby="done-heading">
          <h3 id="done-heading">Done</h3>
          <div class="task-list"></div>
        </section>
      </div>
    </section>
</main>
  <script src="/static/app.js"></script>
</body>
</html>
